<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>驗配紀錄系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e7eeef; --surface:#ffffff; --ink:#16323a; --sub:#5f7a80;
    --brand:#0e8388; --brand-2:#0a5f63; --line:#d6e2e3; --soft:#f3f8f8;
    --ok:#127a5e; --warn-bg:#fff6e8; --warn-line:#f0d59a; --warn-ink:#8a5a00;
    --disp:"Space Grotesk",-apple-system,system-ui,sans-serif;
    --body:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;color:var(--ink);font-family:var(--body);
    background:linear-gradient(180deg,#edf4f4,#e2edee 60%,#dde9ea);min-height:100vh}
  .mark{display:block}

  /* 登入 */
  #gate{max-width:360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
  .gatecard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 26px;
    box-shadow:0 18px 50px -24px rgba(16,50,58,.35);text-align:center}
  .gatecard .mark{width:60px;height:60px;margin:0 auto 14px}
  .gatecard h1{font-family:var(--disp);font-size:22px;letter-spacing:.02em;margin:0 0 2px}
  .gatecard p{color:var(--sub);font-size:13px;margin:0 0 20px}
  .gatecard input{text-align:left;margin-bottom:12px}

  /* 外框 */
  #app{max-width:720px;margin:0 auto;min-height:100vh;background:transparent}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px}
  .brand b{font-family:var(--disp);font-size:18px;letter-spacing:.02em}
  .out{font-size:13px;color:var(--brand-2);font-weight:600;cursor:pointer;background:var(--soft);
    padding:7px 12px;border-radius:999px;border:1px solid var(--line)}
  .who{color:var(--sub);font-size:12px;padding:0 18px 12px}

  /* 分頁膠囊 */
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:5px;margin:0 18px;position:sticky;top:10px;z-index:5;box-shadow:0 6px 20px -14px rgba(16,50,58,.4)}
  .tab{flex:1;text-align:center;padding:10px;border-radius:999px;color:var(--sub);font-weight:600;cursor:pointer;font-size:15px;transition:.15s}
  .tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px -4px var(--brand)}

  main{padding:18px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;
    box-shadow:0 10px 30px -22px rgba(16,50,58,.4)}
  label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px;font-weight:600}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;
    background:#fff;color:var(--ink);font-family:var(--body);transition:.15s}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,131,136,.14)}
  .grid2{display:flex;gap:10px}.grid2>*{flex:1}
  .grid3{display:flex;gap:8px}.grid3>*{flex:1}

  button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%;font-family:var(--body)}
  .primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -8px var(--brand)}
  .primary:active{transform:translateY(1px)}
  .export{background:var(--soft);color:var(--brand-2);border:1px solid var(--line);box-shadow:none}

  .eyebox{border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;margin-top:12px;background:var(--soft)}
  .eyechip{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;font-size:14px;
    color:var(--brand-2);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:999px;margin-bottom:4px}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:4px 0 2px}

  /* 查詢結果 */
  .rescount{color:var(--sub);font-size:13px;margin:4px 2px 10px}
  .rcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:16px;
    padding:14px 16px;margin-bottom:12px;box-shadow:0 10px 26px -22px rgba(16,50,58,.4)}
  .rcard h4{margin:0;font-size:17px;font-family:var(--disp)}
  .rcard .tags{color:var(--sub);font-size:13px;margin:4px 0 2px}
  .rx{display:flex;gap:10px;margin-top:10px}
  .rx .eye{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .rx .eye .lab{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--brand-2)}
  .rx .eye .val{font-size:13px;margin-top:3px;line-height:1.5}
  .rcard img{width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--line)}

  .prev{width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--line)}
  .hidden{display:none!important}
  .ok{background:#e6f5ef;border:1px solid #b3ddca;color:var(--ok);padding:13px;border-radius:12px;font-size:14px;margin-top:14px;font-weight:600}
  .warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);padding:12px;border-radius:12px;font-size:13px;margin-top:12px}
  .spin{text-align:center;color:var(--sub);padding:14px}
  .hint{color:var(--sub);font-size:12px;margin-top:6px}
  .filerow{display:flex;gap:10px}.filerow>*{flex:1}
  input[type=file]{padding:9px;font-size:13px}
</style>
</head>
<body>

<!-- 登入 -->
<div id="gate">
  <div class="gatecard">
    <svg class="mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><defs><filter id="fg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="24" cy="24" r="23" fill="#07242c"/><circle cx="24" cy="24" r="19.5" fill="none" stroke="#2fe08a" stroke-width="2.4" opacity=".85" filter="url(#fg)"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="#63f7a6" stroke-width="5" filter="url(#fg)"/><circle cx="24" cy="24" r="6" fill="#0a2f39"/></svg>
    <h1>驗配紀錄系統</h1>
    <p>角膜塑型 · 登入以繼續</p>
    <input type="email" id="email" placeholder="Email" autocapitalize="off" autocorrect="off">
    <input type="password" id="pw" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary" id="loginbtn" onclick="doLogin()">登入</button>
    <div id="gatemsg" class="hint"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><defs><filter id="fg2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="24" cy="24" r="23" fill="#07242c"/><circle cx="24" cy="24" r="19.5" fill="none" stroke="#2fe08a" stroke-width="2.4" opacity=".85" filter="url(#fg2)"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="#63f7a6" stroke-width="5" filter="url(#fg2)"/><circle cx="24" cy="24" r="6" fill="#0a2f39"/></svg>
      <b>驗配紀錄</b>
    </div>
    <span class="out" onclick="doLogout()">登出</span>
  </header>
  <div id="who" class="who"></div>

  <div class="tabs">
    <div class="tab on" id="t-search" onclick="show('search')">🔍 查詢</div>
    <div class="tab" id="t-new" onclick="show('new')">📷 建檔</div>
  </div>

  <datalist id="dl_hosp"></datalist>
  <datalist id="dl_doc"></datalist>

  <main>
    <!-- 查詢 -->
    <section id="p-search">
      <div class="panel">
        <label>姓名(可部分)</label><input id="q_name" onkeydown="if(event.key==='Enter')doSearch()">
        <div class="grid2">
          <div><label>醫院</label><input id="q_hosp" list="dl_hosp" placeholder="留空=不限"></div>
          <div><label>醫師</label><input id="q_doc" list="dl_doc" placeholder="留空=不限"></div>
        </div>
        <div style="margin-top:14px" class="grid2">
          <button class="primary" onclick="doSearch()">查詢</button>
          <button class="export" onclick="exportExcel()">⬇ 匯出 Excel</button>
        </div>
      </div>
      <div id="results"></div>
    </section>

    <!-- 建檔 -->
    <section id="p-new" class="hidden">
      <div class="panel">
        <div class="kicker">照片</div>
        <div class="filerow">
          <div><label>拍照</label><input type="file" accept="image/*" capture="environment" id="cam" onchange="onPick(this)"></div>
          <div><label>或選檔案</label><input type="file" accept="image/*" id="pick" onchange="onPick(this)"></div>
        </div>
        <img id="prev" class="prev hidden">
      </div>

      <div id="form" class="hidden">
        <div class="panel">
          <div class="kicker">基本資料</div>
          <label>姓名</label><input id="f_name" placeholder="患者姓名">
          <div class="grid2">
            <div><label>病歷號碼</label><input id="f_chart" placeholder="沒有可留空"></div>
            <div><label>聯絡電話</label><input id="f_phone" type="tel" placeholder="患者電話"></div>
          </div>
          <div class="grid2">
            <div><label>醫院</label><input id="f_hosp" list="dl_hosp" placeholder="輸入或選用過的"></div>
            <div><label>醫師</label><input id="f_doc" list="dl_doc" placeholder="輸入或選用過的"></div>
          </div>
          <label>檢查日期</label><input type="date" id="f_date">
        </div>

        <div class="panel">
          <div class="kicker">處方</div>
          <label>鏡片類型</label>
          <select id="f_type" onchange="updateCyl()">
            <option value="標準片">標準片</option>
            <option value="散光片">散光片</option>
            <option value="Topaz">Topaz</option>
            <option value="Topaz散光">Topaz散光</option>
          </select>

          <div class="eyebox">
            <span class="eyechip">OD · 右眼</span>
            <label>顏色</label>
            <select id="od_color"><option value="藍">藍</option><option value="綠">綠</option><option value="紫">紫</option></select>
            <div class="grid3">
              <div><label>TP</label><input id="od_tp"></div>
              <div><label>FK(BC)</label><input id="od_fk"></div>
              <div><label>直徑</label><input id="od_dia"></div>
            </div>
            <div id="od_cyl_wrap" class="hidden"><label>散光度數</label><input id="od_cyl"></div>
          </div>

          <div class="eyebox">
            <span class="eyechip">OS · 左眼</span>
            <label>顏色</label>
            <select id="os_color"><option value="藍">藍</option><option value="綠">綠</option><option value="紫">紫</option></select>
            <div class="grid3">
              <div><label>TP</label><input id="os_tp"></div>
              <div><label>FK(BC)</label><input id="os_fk"></div>
              <div><label>直徑</label><input id="os_dia"></div>
            </div>
            <div id="os_cyl_wrap" class="hidden"><label>散光度數</label><input id="os_cyl"></div>
          </div>
        </div>

        <button class="primary" id="savebtn" onclick="doSave()">💾 存檔</button>
        <div id="okmsg"></div>
      </div>
    </section>
  </main>
</div>

<script>
  const SUPABASE_URL = 'https://vvfvtrmpkvatfhlzwpou.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZwoZ91MG-Gx1uv3TO6PC3Q_R-8OyNzC';
  const BUCKET = 'records-photos';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let BLOB = null;
  const el = id => document.getElementById(id);

  (async function(){ const { data } = await sb.auth.getSession(); if (data.session) enterApp(data.session.user); })();

  async function doLogin(){
    const email = el('email').value.trim(), pw = el('pw').value;
    if(!email || !pw){ el('gatemsg').textContent='請輸入 Email 和密碼'; return; }
    el('loginbtn').disabled=true; el('gatemsg').textContent='登入中…';
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    el('loginbtn').disabled=false;
    if(error){ el('gatemsg').textContent='登入失敗:'+error.message; return; }
    enterApp(data.user);
  }
  function enterApp(user){
    el('gate').classList.add('hidden'); el('app').classList.remove('hidden');
    el('who').textContent = '登入者:' + (user.email||''); loadSuggestions();
  }
  async function doLogout(){ await sb.auth.signOut(); location.reload(); }

  function show(w){
    el('p-search').classList.toggle('hidden', w!=='search');
    el('p-new').classList.toggle('hidden', w!=='new');
    el('t-search').classList.toggle('on', w==='search');
    el('t-new').classList.toggle('on', w==='new');
  }
  function fillDL(id, arr){ const dl=el(id); dl.innerHTML=''; arr.forEach(v=>{ const o=document.createElement('option'); o.value=v; dl.appendChild(o); }); }
  function today(){ const d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

  function updateCyl(){
    const show = el('f_type').value.indexOf('散光') >= 0;
    el('od_cyl_wrap').classList.toggle('hidden', !show);
    el('os_cyl_wrap').classList.toggle('hidden', !show);
  }

  async function loadSuggestions(){
    const { data } = await sb.from('records').select('hospital, doctor');
    if(!data) return;
    const H={}, D={};
    data.forEach(r=>{ if(r.hospital) H[r.hospital]=1; if(r.doctor) D[r.doctor]=1; });
    fillDL('dl_hosp', Object.keys(H).sort()); fillDL('dl_doc', Object.keys(D).sort());
  }

  function eyeVal(tp,fk,dia,color,cyl){
    let s = 'TP '+(tp||'-')+' ・ FK '+(fk||'-')+' ・ 直徑 '+(dia||'-');
    if(color) s += '<br>顏色:'+color;
    if(cyl) s += ' ・ 散光:'+cyl;
    return s;
  }

  async function doSearch(){
    const box=el('results'); box.innerHTML='<div class="spin">查詢中…</div>';
    let q = sb.from('records').select('*').order('exam_date',{ascending:false});
    if(el('q_name').value) q = q.ilike('name', '%'+el('q_name').value+'%');
    if(el('q_hosp').value) q = q.ilike('hospital', '%'+el('q_hosp').value+'%');
    if(el('q_doc').value)  q = q.ilike('doctor', '%'+el('q_doc').value+'%');
    const { data, error } = await q;
    if(error){ box.innerHTML='<div class="warn">錯誤:'+error.message+'</div>'; return; }
    if(!data.length){ box.innerHTML='<div class="spin">沒有符合的紀錄</div>'; return; }
    box.innerHTML='<div class="rescount">共 '+data.length+' 筆</div>';
    for(const r of data){
      const d=document.createElement('div'); d.className='rcard';
      d.innerHTML='<h4>'+(r.name||'(未填姓名)')+'</h4>'+
        '<div class="tags">'+(r.hospital||'-')+' ・ '+(r.doctor||'-')+' ・ '+(r.exam_date||'-')+'<br>'+
        '病歷:'+(r.chart_no||'-')+' ・ 電話:'+(r.phone||'-')+' ・ '+(r.lens_type||'-')+'</div>'+
        '<div class="rx"><div class="eye"><div class="lab">OD 右眼</div><div class="val">'+eyeVal(r.od_tp,r.od_fk,r.od_dia,r.od_color,r.od_cyl)+'</div></div>'+
        '<div class="eye"><div class="lab">OS 左眼</div><div class="val">'+eyeVal(r.os_tp,r.os_fk,r.os_dia,r.os_color,r.os_cyl)+'</div></div></div>';
      box.appendChild(d);
      if(r.photo_path){
        const { data:signed } = await sb.storage.from(BUCKET).createSignedUrl(r.photo_path, 3600);
        if(signed && signed.signedUrl){
          const a=document.createElement('a'); a.href=signed.signedUrl; a.target='_blank';
          const im=document.createElement('img'); im.src=signed.signedUrl; a.appendChild(im); d.appendChild(a);
        }
      }
    }
  }

  async function exportExcel(){
    const { data, error } = await sb.from('records').select('*').order('exam_date',{ascending:false});
    if(error){ alert('匯出失敗:'+error.message); return; }
    if(!data.length){ alert('目前沒有資料'); return; }
    const rows = data.map(r=>({
      '建檔時間': r.created_at ? r.created_at.replace('T',' ').slice(0,16) : '',
      '檢查日期': r.exam_date||'', '姓名': r.name||'', '病歷號碼': r.chart_no||'', '聯絡電話': r.phone||'',
      '醫院': r.hospital||'', '醫師': r.doctor||'', '鏡片類型': r.lens_type||'',
      'OD_顏色': r.od_color||'', 'OD_TP': r.od_tp||'', 'OD_FK(BC)': r.od_fk||'', 'OD_直徑': r.od_dia||'', 'OD_散光': r.od_cyl||'',
      'OS_顏色': r.os_color||'', 'OS_TP': r.os_tp||'', 'OS_FK(BC)': r.os_fk||'', 'OS_直徑': r.os_dia||'', 'OS_散光': r.os_cyl||''
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '驗配總表');
    XLSX.writeFile(wb, '驗配總表_'+today()+'.xlsx');
  }

  function onPick(input){
    const file=input.files[0]; if(!file) return;
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      let max=1600,w=img.width,h=img.height;
      if(Math.max(w,h)>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      el('prev').src=c.toDataURL('image/jpeg',0.85); el('prev').classList.remove('hidden');
      c.toBlob(b=>{ BLOB=b; }, 'image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      el('form').classList.remove('hidden'); el('okmsg').innerHTML='';
      if(!el('f_date').value) el('f_date').value = today();
      updateCyl();
    };
    img.src=url;
  }

  async function doSave(){
    if(!BLOB){ alert('請先拍照或選照片'); return; }
    if(!el('f_name').value.trim()){ alert('請填姓名'); return; }
    el('savebtn').disabled=true; el('okmsg').innerHTML='<div class="spin">上傳中…</div>';
    try{
      const path = Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
      const up = await sb.storage.from(BUCKET).upload(path, BLOB, { contentType:'image/jpeg' });
      if(up.error) throw up.error;
      const ins = await sb.from('records').insert({
        exam_date: el('f_date').value, name: el('f_name').value, chart_no: el('f_chart').value, phone: el('f_phone').value,
        hospital: el('f_hosp').value, doctor: el('f_doc').value, photo_path: path, lens_type: el('f_type').value,
        od_color: el('od_color').value, od_tp: el('od_tp').value, od_fk: el('od_fk').value, od_dia: el('od_dia').value, od_cyl: el('od_cyl').value,
        os_color: el('os_color').value, os_tp: el('os_tp').value, os_fk: el('os_fk').value, os_dia: el('os_dia').value, os_cyl: el('os_cyl').value
      });
      if(ins.error) throw ins.error;
      el('okmsg').innerHTML='<div class="ok">已存檔:'+el('f_name').value+'</div>';
      BLOB=null; el('prev').classList.add('hidden'); el('form').classList.add('hidden');
      el('cam').value=''; el('pick').value='';
      ['f_name','f_chart','f_phone','f_hosp','f_doc','f_date','od_tp','od_fk','od_dia','od_cyl','os_tp','os_fk','os_dia','os_cyl'].forEach(id=>el(id).value='');
      el('f_type').value='標準片'; el('od_color').value='藍'; el('os_color').value='藍'; updateCyl();
      loadSuggestions();
    }catch(e){
      el('okmsg').innerHTML='<div class="warn">存檔失敗:'+(e.message||e)+'</div>';
    }
    el('savebtn').disabled=false;
  }
</script>
</body>
</html>
