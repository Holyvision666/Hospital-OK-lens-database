name: 每週備份寄信

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 台灣時間 09:00 檢查:資料有變動才寄;週日一律寄
  workflow_dispatch: {}   # 可在 Actions 頁手動執行(一律寄出)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取上次備份紀錄
        uses: actions/cache/restore@v4
        with:
          path: .bk_hash
          key: bk-hash-${{ github.run_id }}
          restore-keys: bk-hash-
      - name: 安裝套件
        run: pip install openpyxl
      - name: 產生備份並寄出
        env:
          SB_URL: https://vvfvtrmpkvatfhlzwpou.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: holyvision666@gmail.com
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: holyvision666@gmail.com
          EVENT: ${{ github.event_name }}
        shell: python
        run: |
          import os, re, json, smtplib, urllib.request, datetime, hashlib
          from email.message import EmailMessage
          from openpyxl import Workbook

          url, key = os.environ['SB_URL'], os.environ['SB_KEY']
          if not key or not os.environ['GMAIL_PASS']:
              raise SystemExit('缺少 SUPABASE_SERVICE_KEY 或 GMAIL_APP_PASSWORD secret')

          def fetch(table, order):
              out, start = [], 0
              while True:
                  req = urllib.request.Request(f'{url}/rest/v1/{table}?select=*&order={order}',
                      headers={'apikey': key, 'Authorization': 'Bearer ' + key,
                               'Range-Unit': 'items', 'Range': f'{start}-{start+999}'})
                  rows = json.load(urllib.request.urlopen(req))
                  out += rows
                  if len(rows) < 1000: return out
                  start += 1000

          recs = fetch('records', 'exam_date.asc,id.asc')
          fees = fetch('fees', 'role.asc,name.asc')

          now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          digest = hashlib.sha256(json.dumps([sorted(recs, key=lambda r: r.get('id') or 0), fees], sort_keys=True, ensure_ascii=False, default=str).encode()).hexdigest()
          raw = open('.bk_hash').read().strip() if os.path.exists('.bk_hash') else ''
          try: st = json.loads(raw)
          except Exception: st = {'hash': raw, 'sent': ''}
          old = st.get('hash', '')
          changed = digest != old
          sunday = now.weekday() == 6
          manual = os.environ.get('EVENT') == 'workflow_dispatch'
          if not (changed or sunday or manual):
              print('資料沒有變動,今天不寄信'); raise SystemExit(0)
          since = st.get('sent') or (datetime.datetime.utcnow() - datetime.timedelta(hours=25)).isoformat()
          new_recs = sorted([r for r in recs if str(r.get('created_at') or '') > since], key=lambda r: (r.get('exam_date') or '', r.get('id') or 0))
          new_n = len(new_recs)
          reason = ('資料有變動' if changed else '') + ('、' if changed and (sunday or manual) else '') + ('每週例行' if sunday else '') + ('手動執行' if manual and not sunday else '')
          # 逐筆指紋:找出修改/刪除的紀錄
          def rh(r): return hashlib.sha256(json.dumps(r, sort_keys=True, ensure_ascii=False, default=str).encode()).hexdigest()[:16]
          cur_ids = {str(r.get('id')): rh(r) for r in recs}
          old_ids = st.get('ids')
          new_set = {str(r.get('id')) for r in new_recs}
          mod_recs, del_n = [], 0
          if isinstance(old_ids, dict):
              mod_recs = [r for r in recs if str(r.get('id')) in old_ids and str(r.get('id')) not in new_set and old_ids[str(r.get('id'))] != cur_ids[str(r.get('id'))]]
              del_n = len([k for k in old_ids if k not in cur_ids])

          def D(s):
              m = re.match(r'^(\d{4})-(\d{2})-(\d{2})', str(s or ''))
              return f'{int(m[1])}/{int(m[2])}/{int(m[3])}' if m else (s or '')
          def NT(v):
              v = v or ''
              return {'topaz': 'Topaz', 'topaz散光': 'Topaz散光'}.get(v, v or '標準片')
          def V(v): return '' if v is None else v
          def DT(s):
              if not s: return ''
              d = datetime.datetime.fromisoformat(str(s).replace('Z', '+00:00')) + datetime.timedelta(hours=8)
              return f'{d:%Y/%m/%d %H:%M}'

          TC = {'標準片':'EM','散光片':'ETR','Topaz':'TZ','Topaz散光':'TTR'}
          CC = {'藍':'B','綠':'G','紫':'V'}
          def has(r, e): return bool(r.get(e+'_tp') or r.get(e+'_fk') or r.get(e+'_dia'))
          def rxl(lab, r, e):
              fk, tp, dia, col, cyl = [V(r.get(e+'_'+k)) for k in ('fk','tp','dia','color','cyl')]
              t = f'{lab}:{fk}/{tp}/{dia}' + ('/'+CC[col] if col in CC else ('/?' if (fk or tp) else ''))
              if str(cyl).strip():
                  try: t += ' T%.2f' % abs(float(cyl))
                  except ValueError: t += ' T' + str(cyl)
              return t
          def exp_row(r):
              od, os_ = has(r,'od'), has(r,'os')
              co, cs = TC.get(NT(r.get('od_type') or r.get('lens_type')),''), TC.get(NT(r.get('os_type') or r.get('lens_type')),'')
              kind = (co if co==cs else co+'/'+cs) if (od and os_) else (co if od else (cs if os_ else ''))
              lines = ([rxl('OD',r,'od')] if od else []) + ([rxl('OS',r,'os')] if os_ else [])
              return (int(od)+int(os_)), kind, lines

          cols = ['編號','驗配日期','批價日期','尚未批價','訂片日期','交件日期','醫院','醫師','驗配人員','交件人員','已交件','交件確認時間','病歷號','患者','電話','新/重配',
                  'OD片種','OD顏色','OD TP','OD FK','OD直徑','OD散光','OS片種','OS顏色','OS TP','OS FK','OS直徑','OS散光','備註','照片檔']
          wb = Workbook(); ws = wb.active; ws.title = '全部紀錄'; ws.append(cols)
          for r in recs:
              ws.append([r.get('id'), D(r.get('exam_date')), D(r.get('price_date')), '是' if r.get('price_pending') else '', D(r.get('order_date')), D(r.get('delivery_date')),
                  V(r.get('hospital')), V(r.get('doctor')), V(r.get('fitter')), V(r.get('delivered_by')), '是' if r.get('delivered') else '', DT(r.get('delivered_at')), V(r.get('chart_no')), V(r.get('name')), V(r.get('phone')), V(r.get('fit_type')),
                  NT(r.get('od_type') or r.get('lens_type')), V(r.get('od_color')), V(r.get('od_tp')), V(r.get('od_fk')), V(r.get('od_dia')), V(r.get('od_cyl')),
                  NT(r.get('os_type') or r.get('lens_type')), V(r.get('os_color')), V(r.get('os_tp')), V(r.get('os_fk')), V(r.get('os_dia')), V(r.get('os_cyl')),
                  V(r.get('note')), V(r.get('photo_path'))])
          ws.auto_filter.ref = ws.dimensions
          fs = wb.create_sheet('每片費用'); fs.append(['類別','姓名','每片費用'])
          for f in fees:
              fs.append(['醫師' if f.get('role') == 'doctor' else '驗配人員', f.get('name'), f.get('fee')])

          today = now.strftime('%Y-%m-%d')
          fn = f'驗配系統完整備份_{today}.xlsx'
          wb.save('/tmp/backup.xlsx')

          # 公司報表:全部 + 依驗配人員分頁
          from openpyxl.styles import Alignment, Border, Side, Font, PatternFill
          thin = Side(style='thin', color='000000'); bd = Border(top=thin, bottom=thin, left=thin, right=thin)
          def co_sheet(ws, rows, showF):
              head = ['驗配日期','批價日期','訂片日期','交件日期','醫院','醫師'] + (['驗配人員'] if showF else []) + ['病歷號','患者','新/重配','片數','片種','處方','備註']
              ws.append(head)
              for r in rows:
                  n, kind, lines = exp_row(r)
                  ws.append([D(r.get('exam_date')), D(r.get('price_date')) or ('尚未批價' if r.get('price_pending') else ''), D(r.get('order_date')), D(r.get('delivery_date')), V(r.get('hospital')), V(r.get('doctor'))]
                            + ([V(r.get('fitter'))] if showF else []) + [V(r.get('chart_no')), V(r.get('name')), V(r.get('fit_type')) or '新配', n, kind, '\n'.join(lines), V(r.get('note'))])
              widths = [10,10,10,15,10,8] + ([10] if showF else []) + [11,9,8,5,9,36,30]
              for i, w in enumerate(widths): ws.column_dimensions[chr(65+i)].width = w
              rx_col = len(head) - 1
              dlv_fill = PatternFill('solid', fgColor='EAF6EA')
              for row in ws.iter_rows():
                  dlv = row[0].row > 1 and rows[row[0].row-2].get('delivered')
                  for c in row:
                      c.border = bd
                      c.alignment = Alignment(vertical='center', horizontal='left' if (c.column>=rx_col and c.row>1) else 'center', wrap_text=True)
                      if c.row == 1: c.font = Font(bold=True); c.fill = PatternFill('solid', fgColor='E2EFDA')
                      elif dlv: c.fill = dlv_fill
              ws.auto_filter.ref = ws.dimensions
          srt = sorted(recs, key=lambda r: (r.get('exam_date') or '', r.get('id') or 0))
          cwb = Workbook(); w0 = cwb.active; w0.title = '全部'; co_sheet(w0, srt, True)
          groups = {}
          for r in srt:
              k = re.sub(r'[\\/?*\[\]:]', '', V(r.get('fitter')) or '').strip()[:31] or '未填驗配人員'
              groups.setdefault(k, []).append(r)
          for k in sorted(groups, key=lambda x: (x=='未填驗配人員', x)):
              co_sheet(cwb.create_sheet(k), groups[k], False)
          cfn = f'驗配總表_公司報表_{today}.xlsx'
          cwb.save('/tmp/company.xlsx')

          # 新訂單 LINE 訊息
          line_blocks = []
          for r in new_recs:
              n, kind, lines = exp_row(r)
              if not n: continue
              line_blocks.append('\n'.join([(V(r.get('hospital')) or '(未填醫院)') + ' ' + V(r.get('doctor')), (V(r.get('name')) or '(未填姓名)') + kind] + lines))
          line_text = '\n\n'.join(line_blocks)

          # ---- 信件內容(HTML + 純文字備援) ----
          import html as H
          WD = '一二三四五六日'
          dlabel = f'{now.month}/{now.day}(週{WD[now.weekday()]})'
          CHEERS = [
              '每一副鏡片,都是一個孩子更清楚的明天。謝謝大家的用心!',
              '細心驗配的每一步,家長都看得見。今天也辛苦了!',
              '專業加上耐心,就是最好的服務。繼續加油!',
              '你們讓孩子早上醒來就看得清楚,這件事很了不起。',
              '一點一滴的累積,就是最扎實的成績。為團隊按個讚!',
              '今天的努力,是明天的口碑。謝謝每一位夥伴!',
              '再小的細節也不放過,這就是我們的專業。',
              '每一筆紀錄背後,都是一個家庭的信任。謝謝你們守護它。',
              '辛苦了!記得喝水、休息一下,好狀態才有好表現。',
              '團隊一起努力的樣子,真的很棒!',
              '清楚的視界從你們手上開始。今天也是美好的一天!',
              '把簡單的事做好,就是不簡單。謝謝大家!',
              '你們的耐心,是孩子勇敢戴上鏡片的力量。',
              '每一次準確的處方,都是專業的證明。繼續保持!',
              '感謝醫師與驗配同仁的合作,一起把事情做到最好。',
              '進步不必一次很多,穩穩往前就很好。加油!',
              '今天也有孩子因為你們看得更清楚了,真好。',
              '好的服務會被記住,你們正在創造這樣的回憶。',
              '一起努力,一起成長。這週也辛苦大家了!',
              '用心的人運氣都不會太差,繼續衝!',
              '每一個「謝謝你」,都是對你們專業最好的肯定。',
              '把每位患者當成家人照顧,這份溫度很珍貴。',
              '穩定、準確、貼心——這就是我們的團隊。',
              '今天的你,也比昨天更厲害一點!',
              '辛苦的付出,都會在孩子的笑容裡看到回報。',
              '保持熱情,保持好奇,每天都會有新的收穫。',
              '謝謝大家把每一件小事都放在心上。',
              '視力守護者們,今天也請多多關照自己!',
              '一步一腳印,我們一起走得又穩又遠。',
              '再忙也別忘了:你們做的事情,很有意義。',
          ]
          cheer = CHEERS[(now.toordinal()) % len(CHEERS)]
          undel = len([r for r in recs if not r.get('delivered') and exp_row(r)[0]])
          if new_n: subj_head = f'新增 {new_n} 筆訂單'
          elif mod_recs or del_n: subj_head = '資料有修改'
          else: subj_head = '每週備份'
          msg = EmailMessage()
          msg['Subject'] = f'驗配系統|{dlabel} {subj_head}(共 {len(recs)} 筆)'
          msg['From'] = os.environ['GMAIL_USER']; msg['To'] = os.environ['MAIL_TO']

          # 純文字版
          T = [f'驗配紀錄系統|{dlabel}', '', f'☀ {cheer}', '',
               f'■ 今日摘要', f'新增訂單:{new_n} 筆' + (f'  修改:{len(mod_recs)} 筆' if mod_recs else '') + (f'  刪除:{del_n} 筆' if del_n else ''),
               f'系統總筆數:{len(recs)} 筆(尚未交件 {undel} 筆)', '']
          if line_text: T += ['■ 新訂單(LINE 格式,可直接複製)', '', line_text, '']
          if mod_recs:
              T += ['■ 有修改的紀錄'] + [f'・{D(r.get("exam_date"))} {V(r.get("name"))}({V(r.get("hospital"))} {V(r.get("doctor"))})' for r in mod_recs[:30]] + ([f'…另有 {len(mod_recs)-30} 筆'] if len(mod_recs) > 30 else []) + ['']
          T += ['■ 附件說明',
                f'1. {cfn}', '   給公司的報表。第一頁是全部,後面依驗配人員分頁;淡綠底色 = 已交件。',
                f'2. {fn}', '   系統資料的完整備份,平常不用開。萬一資料出問題,可在網站「查詢 → ⋯ → 匯入備份」還原。', '',
                '寄送規則:每天上午檢查一次,有新增或修改才寄;每週日固定寄一封備份。']
          msg.set_content('\n'.join(T))

          # HTML 版
          e = lambda x: H.escape(str(x or ''))
          C = '#0f6e66'
          def tile(lbl, val, sub=''):
              return (f'<td style="padding:4px"><div style="background:#f3f7f7;border:1px solid #dfe9e9;border-radius:12px;padding:12px 10px;text-align:center">'
                      f'<div style="font-size:12px;color:#5b6b6e">{lbl}</div><div style="font-size:26px;font-weight:700;color:#14282b;line-height:1.3">{val}</div>'
                      f'<div style="font-size:11px;color:#8a9799">{sub}</div></div></td>')
          def sec(title): return f'<h3 style="margin:26px 0 10px;font-size:16px;color:{C};border-left:4px solid {C};padding-left:8px">{title}</h3>'
          h = [f'<div style="max-width:560px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,\'PingFang TC\',\'Microsoft JhengHei\',sans-serif;color:#14282b;font-size:15px;line-height:1.6">',
               f'<div style="padding:4px 2px 12px;border-bottom:1px solid #e4ecec"><div style="font-size:13px;color:#5b6b6e">驗配紀錄系統</div><div style="font-size:20px;font-weight:700">{dlabel} 報告</div></div>',
               f'<div style="margin-top:12px;background:#fff8e6;border:1px solid #f3dfa8;border-radius:12px;padding:12px 14px;font-size:15px;color:#6b4e00">☀ {e(cheer)}</div>',
               '<table role="presentation" style="width:100%;border-collapse:collapse;margin-top:12px"><tr>'
               + tile('新增訂單', f'{new_n} 筆', '上次寄信後')
               + tile('有修改', (f'{len(mod_recs)} 筆' if isinstance(old_ids, dict) else '—'), (f'刪除 {del_n} 筆' if del_n else '既有紀錄'))
               + tile('尚未交件', f'{undel} 筆', f'系統共 {len(recs)} 筆')
               + '</tr></table>']
          h.append(sec('新訂單(LINE 格式)'))
          if line_blocks:
              h.append('<div style="font-size:12px;color:#5b6b6e;margin-bottom:6px">長按下面文字即可複製,貼到 LINE 給工廠/同事</div>')
              h.append('<div style="background:#f6f8f8;border:1px solid #dfe9e9;border-radius:10px;padding:12px 14px;font-size:15px;white-space:pre-wrap">' + e(line_text) + '</div>')
          else:
              h.append('<div style="color:#8a9799">這次沒有新的訂單。</div>')
          if mod_recs:
              h.append(sec(f'有修改的紀錄({len(mod_recs)} 筆)'))
              rows = ''.join(f'<tr><td style="padding:6px 8px;border-bottom:1px solid #eef2f2;white-space:nowrap;color:#5b6b6e">{e(D(r.get("exam_date")))}</td>'
                             f'<td style="padding:6px 8px;border-bottom:1px solid #eef2f2;font-weight:600">{e(r.get("name"))}</td>'
                             f'<td style="padding:6px 8px;border-bottom:1px solid #eef2f2;color:#5b6b6e">{e(r.get("hospital"))} {e(r.get("doctor"))}</td></tr>' for r in mod_recs[:30])
              h.append(f'<table style="width:100%;border-collapse:collapse;font-size:14px">{rows}</table>')
              if len(mod_recs) > 30: h.append(f'<div style="color:#8a9799;font-size:13px">…另有 {len(mod_recs)-30} 筆</div>')
          h.append(sec('附件說明'))
          def att(n, name, desc): return (f'<div style="border:1px solid #dfe9e9;border-radius:10px;padding:10px 12px;margin-bottom:8px">'
                                          f'<div style="font-weight:700">{n}. {e(name)}</div><div style="font-size:13px;color:#5b6b6e">{desc}</div></div>')
          h.append(att(1, cfn, '給公司的報表。第一頁是全部,後面依驗配人員分頁;<span style="background:#EAF6EA;padding:0 4px;border-radius:3px">淡綠底色</span> = 已交件。'))
          h.append(att(2, fn, '系統資料的完整備份,<b>平常不用開</b>。萬一資料出問題,可在網站「查詢 → ⋯ → 匯入備份」還原。'))
          h.append('<div style="margin-top:22px;padding-top:10px;border-top:1px solid #e4ecec;font-size:12px;color:#8a9799">寄送規則:每天上午檢查一次,有新增或修改才寄;每週日固定寄一封備份。</div></div>')
          msg.add_alternative(''.join(h), subtype='html')
          for path, name in (('/tmp/company.xlsx', cfn), ('/tmp/backup.xlsx', fn)):
              with open(path, 'rb') as fh:
                  msg.add_attachment(fh.read(), maintype='application',
                      subtype='vnd.openxmlformats-officedocument.spreadsheetml.sheet', filename=name)
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_PASS'])
              s.send_message(msg)
          print('已寄出', len(recs), '筆,原因:', reason)
          open('.bk_hash','w').write(json.dumps({'hash': digest, 'sent': datetime.datetime.utcnow().isoformat(), 'ids': cur_ids}))
      - name: 記錄這次備份
        if: success() && hashFiles('.bk_hash') != ''
        uses: actions/cache/save@v4
        with:
          path: .bk_hash
          key: bk-hash-${{ github.run_id }}
